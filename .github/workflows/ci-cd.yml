name: CI/CD

on:
  push:
    branches: [ "main", "staging" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0

      - name: Restaurar dependências da API
        run: dotnet restore src/WasteManagement.API/WasteManagement.API.csproj

      - name: Restaurar dependências dos testes
        run: dotnet restore tests/WasteManagement.Tests/WasteManagement.Tests.csproj

      - name: Build da API
        run: dotnet build src/WasteManagement.API/WasteManagement.API.csproj --configuration Release --no-restore

      - name: Executar testes automatizados BDD, API e contrato
        run: dotnet test tests/WasteManagement.Tests/WasteManagement.Tests.csproj --configuration Release --no-restore --logger "trx;LogFileName=test-results.trx"

      - name: Publicar evidência dos testes
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: tests/WasteManagement.Tests/TestResults/**/*.trx

    - name: Deploy Staging
      if: github.ref == 'refs/heads/staging'
      run: echo "Deploy staging..."

    - name: Deploy Production
      if: github.ref == 'refs/heads/main'
      run: echo "Deploy produção..."